name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Check minimal feature set
        run: cargo test --locked -p cntryl-stress --no-default-features

      - name: Compile benchmark targets
        run: cargo bench --locked -p cntryl-stress-demo --no-run

      - name: Run smoke benchmark
        run: cargo bench --locked -p cntryl-stress-demo --bench stress-demo1 -- --profile smoke --no-progress

      - name: Validate emitted artifact against JSON Schema
        shell: bash
        run: |
          set -euo pipefail
          artifact_path="$(find . -path '*/target/stress/stress-demo1/latest.json' -print -quit)"
          test -n "$artifact_path"
          npx --yes ajv-cli@5 validate --spec=draft2020 --strict=false \
            -s core/schema/cntryl-stress.v2.schema.json \
            -d "$artifact_path"

      - name: Verify published package shape
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked -p cntryl-stress-macros --allow-dirty
          macro_package="$(find target/package -maxdepth 1 -type d -name 'cntryl-stress-macros-*' -print -quit)"
          test -n "$macro_package"
          cargo test --locked --manifest-path "$macro_package/Cargo.toml" --all-targets
          cargo test --locked --manifest-path "$macro_package/Cargo.toml" --doc
          cargo package --locked --list -p cntryl-stress --allow-dirty

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Compares the public API against the newest release on crates.io. The
      # allowed kind of change comes from the version bump in Cargo.toml.
      - name: Check semver against crates.io
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: cntryl-stress

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.85"

      - name: Check all targets at MSRV
        run: cargo check --locked --workspace --all-targets --all-features

      # trybuild UI stderr expectations (macros/tests/ui) are toolchain-specific
      # and are pinned to stable diagnostics, so the UI test binary is not run
      # here; it runs in the stable job instead. (A libtest `--skip` filter
      # cannot be used because the harness=false bench targets reject it.)
      - name: Test at MSRV
        run: |
          cargo test --locked --workspace --all-targets --all-features --exclude cntryl-stress-macros
          cargo test --locked -p cntryl-stress-macros --lib --all-features

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
