name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches published crates
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          versions="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          names = {"cntryl-stress", "cntryl-stress-macros"}
          versions = {
              package["name"]: package["version"]
              for package in metadata["packages"]
              if package["name"] in names
          }
          if names != versions.keys() or len(set(versions.values())) != 1:
              raise SystemExit(f"published package versions are inconsistent: {versions}")
          print(next(iter(versions.values())))
          ')
          test "$RELEASE_TAG" = "v$versions"

      - name: Verify package contents
        run: |
          cargo package --locked -p cntryl-stress-macros
          cargo package --locked --no-verify -p cntryl-stress

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish macros crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p cntryl-stress-macros

      - name: Wait for macros crate to reach the index
        run: |
          macros_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import sys
          metadata = json.load(sys.stdin)
          print(next(package["version"] for package in metadata["packages"] if package["name"] == "cntryl-stress-macros"))
          ')"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://crates.io/api/v1/crates/cntryl-stress-macros/$macros_version" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "cntryl-stress-macros $macros_version did not become visible on crates.io" >&2
          exit 1

      - name: Publish core crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p cntryl-stress
