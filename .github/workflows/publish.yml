name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read release versions from Cargo manifests
        id: version
        run: |
          core_version="$(sed -n '/^\[package\]/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' core/Cargo.toml | head -n 1)"
          macros_version="$(sed -n '/^\[package\]/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' macros/Cargo.toml | head -n 1)"
          test -n "${core_version}"
          test -n "${macros_version}"
          test "${core_version}" = "${macros_version}"
          echo "version=${core_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify macros package contents
        run: cargo package --locked -p cntryl-stress-macros

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish macros crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p cntryl-stress-macros

      - name: Wait for macros crate to reach the index
        run: |
          macros_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import sys
          metadata = json.load(sys.stdin)
          print(next(package["version"] for package in metadata["packages"] if package["name"] == "cntryl-stress-macros"))
          ')"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://crates.io/api/v1/crates/cntryl-stress-macros/$macros_version" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "cntryl-stress-macros $macros_version did not become visible on crates.io" >&2
          exit 1

      - name: Verify core package contents
        run: cargo package --locked -p cntryl-stress

      - name: Publish core crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p cntryl-stress

      - name: Create release tag when absent
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
          git push origin "${tag}"
