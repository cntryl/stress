[package]
name = "cntryl-stress-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Proc macros for the cntryl-stress benchmark framework"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cntryl-stress-macros"
readme = "README.md"
keywords = ["benchmark", "stress", "testing", "performance"]
categories = ["development-tools::profiling", "development-tools::testing"]
exclude = ["tests/ui.rs", "tests/ui/**"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
stress_alias = { package = "cntryl-stress", path = "../stress" }
trybuild = "=1.0.119"
