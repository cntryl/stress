[package]
name = "cntryl-stress"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Raw-sample-first stress benchmarking framework for Tier 1 through Tier 6 performance work"
license = "Apache-2.0"
repository = "https://github.com/cntryl/stress"
homepage = "https://github.com/cntryl/stress"
documentation = "https://docs.rs/cntryl-stress"
readme = "../README.md"
keywords = ["benchmark", "stress", "testing", "performance"]
categories = ["development-tools::profiling", "development-tools::testing"]

[features]
default = []
cli = ["dep:anyhow", "dep:clap", "dep:syn", "dep:toml"]
# Drive async benchmarks on a tokio runtime (`#[stress(runtime = "tokio")]`).
tokio = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
syn = { version = "2", features = ["full"], optional = true }
toml = { version = "1", optional = true }
linkme = "0.3"
# tokio 1.x declares rust-version 1.71, compatible with this crate's 1.85 MSRV.
tokio = { version = "1.38", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync"], optional = true }
cntryl-stress-macros = { version = "=0.4.0", path = "../macros" }

[target.'cfg(unix)'.dependencies]
# Already in the tree through fs2; used directly for getrusage peak RSS.
libc = "0.2"

[dev-dependencies]
trybuild = "=1.0.119"

[[bin]]
name = "cargo-stress"
path = "src/bin/cargo-stress.rs"
required-features = ["cli"]

[[test]]
name = "github_actions_json"
path = "tests/github_actions_json.rs"
harness = false

[[test]]
name = "noise_aware_gating"
path = "tests/noise_aware_gating.rs"
harness = false
